name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - name: Headless chay dung lenh trong game.contract.json va tat dinh
        run: |
          CMD=$(node -p "require('./game.contract.json').headless_cmd")
          $CMD --seed 5 --night 1 --ticks 5000 --out a.jsonl
          $CMD --seed 5 --night 1 --ticks 5000 --out b.jsonl
          cmp a.jsonl b.jsonl
          tail -1 a.jsonl
      - run: npm run build
