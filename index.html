<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đảo Đèn Lồng</title>
  <style>
    /* Ticket-04 §4: chữ tối thiểu 18 px; tùy chọn chữ lớn ×1.25 (class "big"); giảm chuyển động (class "calm"). */
    :root { --text: #F5F1E6; --gold: #F2C14E; --danger: #FF5A5F; --panel: rgba(14, 20, 48, .78); font-size: 18px; }
    :root.big { font-size: 22.5px; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0E1430; font-family: system-ui, sans-serif; color: var(--text); user-select: none; }
    small { font-size: 1rem; opacity: .85; }
    .hud { position: fixed; pointer-events: none; font-size: 1rem; text-shadow: 0 1px 3px #000; }
    #flames { top: 14px; left: 16px; font-size: 1.5rem; letter-spacing: 4px; }
    #timer { top: 12px; left: 50%; transform: translateX(-50%); font-size: 1.6rem; font-weight: 700; }
    #timer.danger { color: var(--danger); animation: blink .6s steps(2) infinite; }
    :root.calm #timer.danger { animation: none; }
    @keyframes blink { 50% { opacity: .35; } }
    #topright { top: 14px; right: 16px; text-align: right; line-height: 1.5; }
    #topright b { color: var(--gold); }
    #bar { bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; }
    #bar i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #FFE58A55; background: #0E143088; }
    #bar i.on { background: radial-gradient(#FFF6C2, #FFE58A); box-shadow: 0 0 10px #FFE58A; }
    #cds { bottom: 16px; right: 16px; display: flex; gap: 10px; }
    .cd { width: 4.4rem; height: 4.4rem; border-radius: 12px; background: var(--panel); border: 2px solid var(--gold); display: grid; place-items: center; font-size: 1rem; line-height: 1.1; text-align: center; position: relative; overflow: hidden; }
    .cd em { font-style: normal; color: var(--gold); }
    .cd span { position: absolute; left: 0; right: 0; bottom: 0; background: #0008; }
    #prompt { bottom: 70px; left: 50%; transform: translateX(-50%); background: var(--panel); padding: 6px 14px; border-radius: 8px; display: none; }
    #arrow { width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-bottom: 30px solid #FFB347; display: none; filter: drop-shadow(0 0 6px #FFB347); }
    #shade-arrow { width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-bottom: 30px solid #B48CFF; display: none; filter: drop-shadow(0 0 6px #7A3CFF); }
    :root.cbm #shade-arrow { border-bottom-color: #00B3FF; }
    #banner { top: 3.6rem; left: 50%; transform: translateX(-50%); color: var(--gold); font-size: 1.2rem; display: none; background: var(--panel); padding: 4px 14px; border-radius: 8px; }
    .card { max-height: 92vh; overflow-y: auto; }
    .krow { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .kbtn { min-width: 6rem; margin: 3px; }
    .kbtn.dup { border-color: var(--danger) !important; color: var(--danger) !important; }
    #keys-note { min-height: 1.4em; color: var(--gold); }
    table { border-collapse: collapse; margin: 8px auto; }
    td, th { padding: 4px 10px; border-bottom: 1px solid #F2C14E44; }
    tr.me td { color: var(--gold); font-weight: 700; }
    input[type=text] { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--gold); background: #0E1430; color: var(--text); }
    .screen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(14, 20, 48, .82); }
    .screen.show { display: flex; }
    .card { background: #1B2350; border: 1px solid var(--gold); border-radius: 16px; padding: 28px 40px; text-align: center; max-width: 520px; }
    .card h1 { margin: 0 0 10px; color: var(--gold); }
    .card p { line-height: 1.5; }
    button { font: inherit; margin: 6px; padding: 9px 20px; border-radius: 10px; border: 0; background: #FFB347; color: #0E1430; cursor: pointer; font-weight: 600; }
    button.alt { background: transparent; color: var(--text); border: 1px solid var(--text); }
    label { display: block; margin: 12px 0; }
    #help { position: fixed; bottom: 4px; left: 8px; font-size: 1rem; opacity: .75; pointer-events: none; max-width: calc(100% - 13rem); text-shadow: 0 1px 3px #000; }
    #bar { bottom: 2.4rem !important; }
  </style>
</head>
<body>
  <div id="flames" class="hud"></div>
  <div id="timer" class="hud"></div>
  <div id="topright" class="hud"></div>
  <div id="banner" class="hud"></div>
  <div id="bar" class="hud"></div>
  <div id="cds" class="hud"><div class="cd" id="cd-dash">Lướt<br><em id="k-dash">F</em><span></span></div><div class="cd" id="cd-pulse">Tỏa<br><em id="k-pulse">Q</em><span></span></div></div>
  <div id="prompt" class="hud"></div>
  <div id="arrow" class="hud"></div>
  <div id="shade-arrow" class="hud"></div>
  <div id="help"></div>


  <div id="s-menu" class="screen show"><div class="card"><h1>Đảo Đèn Lồng</h1><p>Giúp Mây thắp lại đèn lồng trên ba hòn đảo giữa biển mây.</p><button id="b-start">Bắt đầu</button><button class="alt" id="b-lb">Bảng xếp hạng</button><button class="alt" id="b-settings1">Cài đặt</button></div></div>
  <div id="s-intro" class="screen"><div class="card"><h1 id="intro-title"></h1><p id="intro-text"></p><button id="b-go">Vào đêm</button></div></div>
  <div id="s-result" class="screen"><div class="card"><h1 id="res-title"></h1><p id="res-text"></p><div id="res-save"></div><button id="b-next">Tiếp</button></div></div>
  <div id="s-dawn" class="screen"><div class="card"><h1>Bình Minh</h1><p id="dawn-text"></p><div id="dawn-save"></div><button id="b-menu2">Về menu</button></div></div>
  <div id="s-lb" class="screen"><div class="card"><h1>Bảng xếp hạng</h1>
    <table><thead><tr><th>#</th><th>Tên</th><th>Điểm</th><th>Đêm thắng</th><th>Lúc</th></tr></thead><tbody id="lb-body"></tbody></table>
    <button id="b-lb-close">Về menu</button></div></div>
  <div id="s-pause" class="screen"><div class="card"><h1>Tạm dừng</h1><button id="b-resume">Tiếp tục</button><button id="b-retry">Chơi lại Đêm</button><button class="alt" id="b-settings2">Cài đặt</button><button class="alt" id="b-menu">Về menu</button></div></div>
  <div id="s-settings" class="screen"><div class="card"><h1>Cài đặt</h1>
    <label>Âm lượng <input id="vol" type="range" min="0" max="1" step="0.05"></label>
    <label>Độ nhạy chuột <input id="sens" type="range" min="0.05" max="1" step="0.05"></label>
    <label><input id="cb" type="checkbox"> Bảng màu dễ phân biệt</label>
    <label><input id="rm" type="checkbox"> Giảm chuyển động (tắt nhấp nháy)</label>
    <label><input id="big" type="checkbox"> Chữ lớn (×1.25)</label>
    <h3>Phím</h3>
    <div id="keys"></div>
    <div id="keys-note"></div>
    <button class="alt" id="b-keys-reset">Khôi phục mặc định</button>
    <button id="b-close">Xong</button></div></div>
  <div id="save-form" style="display:none">
    <p id="save-msg"></p>
    <label>Tên (3–12 ký tự) <input id="name" type="text" maxlength="12" autocomplete="off"></label>
    <button id="b-save">Lưu điểm</button>
  </div>
  <script type="module" src="/src/web/main.js"></script>
</body>
</html>
