<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đảo Đèn Lồng</title>
  <style>
    :root { --text: #F5F1E6; --gold: #F2C14E; --danger: #FF5A5F; --panel: rgba(14, 20, 48, .78); }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0E1430; font-family: system-ui, sans-serif; color: var(--text); user-select: none; }
    .hud { position: fixed; pointer-events: none; font-size: 16px; text-shadow: 0 1px 3px #000; }
    #flames { top: 14px; left: 16px; font-size: 26px; letter-spacing: 4px; }
    #timer { top: 12px; left: 50%; transform: translateX(-50%); font-size: 28px; font-weight: 700; }
    #timer.danger { color: var(--danger); animation: blink .6s steps(2) infinite; }
    @keyframes blink { 50% { opacity: .35; } }
    #topright { top: 14px; right: 16px; text-align: right; line-height: 1.5; }
    #topright b { color: var(--gold); }
    #bar { bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; }
    #bar i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #FFE58A55; background: #0E143088; }
    #bar i.on { background: radial-gradient(#FFF6C2, #FFE58A); box-shadow: 0 0 10px #FFE58A; }
    #cds { bottom: 16px; right: 16px; display: flex; gap: 10px; }
    .cd { width: 56px; height: 56px; border-radius: 12px; background: var(--panel); border: 2px solid var(--gold); display: grid; place-items: center; font-size: 12px; text-align: center; position: relative; overflow: hidden; }
    .cd span { position: absolute; left: 0; right: 0; bottom: 0; background: #0008; }
    #prompt { bottom: 70px; left: 50%; transform: translateX(-50%); background: var(--panel); padding: 6px 14px; border-radius: 8px; display: none; }
    #arrow { width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-bottom: 30px solid #FFB347; display: none; filter: drop-shadow(0 0 6px #FFB347); }
    #banner { top: 64px; left: 50%; transform: translateX(-50%); color: var(--gold); font-size: 18px; display: none; }
    .screen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(14, 20, 48, .82); }
    .screen.show { display: flex; }
    .card { background: #1B2350; border: 1px solid var(--gold); border-radius: 16px; padding: 28px 40px; text-align: center; max-width: 520px; }
    .card h1 { margin: 0 0 10px; color: var(--gold); }
    .card p { line-height: 1.5; }
    button { font: inherit; margin: 6px; padding: 9px 20px; border-radius: 10px; border: 0; background: #FFB347; color: #0E1430; cursor: pointer; font-weight: 600; }
    button.alt { background: transparent; color: var(--text); border: 1px solid var(--text); }
    label { display: block; margin: 12px 0; }
    #help { position: fixed; bottom: 4px; left: 8px; font-size: 12px; opacity: .6; pointer-events: none; }
  </style>
</head>
<body>
  <div id="flames" class="hud"></div>
  <div id="timer" class="hud"></div>
  <div id="topright" class="hud"></div>
  <div id="banner" class="hud"></div>
  <div id="bar" class="hud"></div>
  <div id="cds" class="hud"><div class="cd" id="cd-dash">Lướt<br>Shift<span></span></div><div class="cd" id="cd-pulse">Tỏa<br>Q<span></span></div></div>
  <div id="prompt" class="hud"></div>
  <div id="arrow" class="hud"></div>
  <div id="help">WASD đi · kéo chuột/←→ xoay · Space nhảy · Shift lướt · E nạp đèn · Q tỏa sáng · Esc/P tạm dừng</div>


  <div id="s-menu" class="screen show"><div class="card"><h1>Đảo Đèn Lồng</h1><p>Giúp Mây thắp lại đèn lồng trên ba hòn đảo giữa biển mây.</p><button id="b-start">Bắt đầu</button><button class="alt" id="b-settings1">Cài đặt</button></div></div>
  <div id="s-intro" class="screen"><div class="card"><h1 id="intro-title"></h1><p id="intro-text"></p><button id="b-go">Vào đêm</button></div></div>
  <div id="s-result" class="screen"><div class="card"><h1 id="res-title"></h1><p id="res-text"></p><button id="b-next">Tiếp</button></div></div>
  <div id="s-dawn" class="screen"><div class="card"><h1>Bình Minh</h1><p id="dawn-text"></p><button id="b-menu2">Về menu</button></div></div>
  <div id="s-pause" class="screen"><div class="card"><h1>Tạm dừng</h1><button id="b-resume">Tiếp tục</button><button id="b-retry">Chơi lại Đêm</button><button class="alt" id="b-settings2">Cài đặt</button><button class="alt" id="b-menu">Về menu</button></div></div>
  <div id="s-settings" class="screen"><div class="card"><h1>Cài đặt</h1>
    <label>Âm lượng <input id="vol" type="range" min="0" max="1" step="0.05"></label>
    <label>Độ nhạy chuột <input id="sens" type="range" min="0.05" max="1" step="0.05"></label>
    <label><input id="cb" type="checkbox"> Bảng màu dễ phân biệt</label>
    <button id="b-close">Xong</button></div></div>
  <script type="module" src="/src/web/main.js"></script>
</body>
</html>
